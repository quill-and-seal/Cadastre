<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastre : banc d'essai</title>
  <!-- Banc d'essai de l'éditeur hors de Foundry. À servir depuis la racine du dépôt :
       python3 -m http.server   puis   http://localhost:8000/tools/editor-lab.html
       Le bouton « Bibliothèque » de la palette (ou un glisser-déposer d'images sur la page)
       ajoute des images ; un nom qui contient « texture », « sol », « floor »… en fait une texture. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../styles/cadastre.css">
  <style>
    html, body { margin: 0; height: 100%; background: #0d0c0f; font-family: system-ui, sans-serif; }
    #editor { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <input type="file" id="files" accept="image/*" multiple hidden>
  <script type="module">
    import { MapEditor } from "../scripts/editor.js";
    import { createMap } from "../scripts/model.js";
    import { renderSVG } from "../scripts/render.js";
    import { assetFromFile, mergeAssets, normalizeLibrary } from "../scripts/library.js";

    const lang = await (await fetch("../lang/fr.json")).json();
    const t = (key, data) => {
      let s = key.split(".").reduce((o, k) => o?.[k], lang) ?? key;
      for (const [k, v] of Object.entries(data ?? {})) s = s.replaceAll(`{${k}}`, v);
      return s;
    };
    const load = (key) => { try { return JSON.parse(localStorage.getItem(key) ?? "null"); } catch { return null; } };
    const store = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* quota, navigation privée */ } };

    let library = normalizeLibrary(load("cadastre-lab-library") ?? []);

    /** Images du disque → assets (data URI : rien n'est envoyé nulle part). */
    async function addFiles(files) {
      const assets = [];
      for (const file of files) {
        if (!file.type.startsWith("image/")) continue;
        const src = await new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsDataURL(file); });
        const img = new Image(); img.src = src; await img.decode().catch(() => {});
        const asset = assetFromFile(file.name, { width: img.naturalWidth, height: img.naturalHeight, ppc: 200 });
        assets.push({ ...asset, src });
      }
      library = mergeAssets(library, assets);
      store("cadastre-lab-library", library);
      window.editor.setLibrary(library);
    }
    window.addLabFiles = addFiles;

    const input = document.getElementById("files");
    input.addEventListener("change", () => { addFiles([...input.files]); input.value = ""; });
    document.addEventListener("dragover", (e) => e.preventDefault());
    document.addEventListener("drop", (e) => { e.preventDefault(); addFiles([...e.dataTransfer.files]); });

    window.editor = new MapEditor(document.getElementById("editor"), load("cadastre-lab") ?? createMap({ name: "Essai" }), {
      t,
      library,
      onOpenLibrary: () => input.click(),
      onSave: (map) => { store("cadastre-lab", map); window.editor.markSaved(map); },
      onExport: (map) => {
        const url = URL.createObjectURL(new Blob([renderSVG(map)], { type: "image/svg+xml" }));
        window.open(url, "_blank");
      }
    });
  </script>
</body>
</html>
